[project]
name = "aez-api"
version = "0.1.0"
description = "AEZ Creator & Weather Index Insurance Platform — API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "celery[redis]>=5.4",
    "numpy>=2.0",
    "requests>=2.32",
    "rasterio>=1.3",
    "scikit-learn>=1.5",
    "shapely>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
